version: "3.8"

services:
  project-alpha-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-alpha-v2
    restart: unless-stopped
    ports:
      - ":5001"
    env_file:
      - path: .env
        required: false
    volumes:
      - alpha_v2_data:/app/v2/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  alpha_v2_data:
    name: project_alpha_v2_sqlite_data
